spring.application.name=feedback

# 기본 프로필은 dev 다. 아무 옵션 없이 띄우면 H2 인메모리 + 데모 로그인으로 뜬다.
# 프로필별 설정은 application-{프로필}.properties 에 있다. dev 는 application-dev.properties 다.
# 운영·도커는 실행할 때 프로필을 지정한다. 예: --spring.profiles.active=docker
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# H2 콘솔은 dev 프로필에서만 켠다. 여기서 꺼 두면 프로필을 빠뜨려도 운영에 노출되지 않는다.
spring.h2.console.enabled=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# 데모 로그인(POST /api/dev/login, POST /api/dev/logout)은 DevLoginController 에 @Profile("dev") 가 붙어 있다.
# dev 가 아닌 프로필에서는 빈으로 등록되지 않으므로 경로 자체가 없고 404 가 된다(기획안 13-2).
# 7단계부터는 이 데모 로그인과 별개로 구글 로그인이 추가된다 — 아래 OAuth2 설정 참고.
# 데모 로그인은 지우지 않았다. dev 프로필에서는 구글 계정 없이도 역할별 화면을 빠르게 미리 볼 수 있어야 한다.

# ── 구글 로그인(기획안 7·10장, 13-5 7단계) ──────────────────────────────────
# 여기엔 client-id를 선언하지 않는다. 메일(아래 SPRING_MAIL_*)과 같은 이유다 —
# spring.security.oauth2.client.registration.google.client-id를 "빈 문자열로라도" 선언해 두면
# Spring Boot가 "google이라는 등록이 있기는 한데 client-id가 비어 있다"고 보고 기동 자체를
# 실패시킨다(OAuth2ClientProperties 검증). 아예 선언을 안 해야 "등록 자체가 없음"으로 보고
# 건너뛴다 — 그래야 ClientRegistrationRepository 빈이 안 생기고, SecurityConfig의 ObjectProvider가
# 구글 로그인을 조용히 꺼 둔 채로(=데모 로그인만 되는 지금까지와 동일하게) 기동한다.
#
# 발급 방법(Google Cloud Console, console.cloud.google.com):
#   1. 프로젝트 선택 → "API 및 서비스" → "사용자 인증 정보" → "사용자 인증 정보 만들기"
#      → "OAuth 클라이언트 ID" → 애플리케이션 유형 "웹 애플리케이션"
#   2. "승인된 리디렉션 URI"에 다음을 등록한다(Spring Security 기본 콜백 경로,
#      패턴은 /login/oauth2/code/{registrationId} 이고 registrationId는 google 이다):
#        로컬:     http://localhost:8080/login/oauth2/code/google
#        배포:     https://{실제 배포 주소}/login/oauth2/code/google
#      (로컬·배포 둘 다 등록해 둔다 — 기획안 7단계 완료 조건 "로컬과 배포 주소 모두 등록된다")
#   3. 발급된 클라이언트 ID·보안 비밀을 아래 환경 변수로 채워서 띄운다 — 이때만 실제로 켜진다.
#        SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID=...
#        SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET=...
#      scope는 기본값(openid,profile,email)을 그대로 쓴다. 바꿀 필요가 생기면 이렇게 추가한다:
#        SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_SCOPE=openid,email,profile

# 최초 개발자 계정(기획안 3-2 "DB에 직접 등록")을 대신한다. 이 이메일로 처음 구글 로그인하면
# DEVELOPER·ACTIVE로 바로 만들어진다 — 그 이후 계정은 이 개발자가 계정 관리 화면에서 승인한다.
# 비워 두면(기본값) 이 동작은 꺼지고, 일반 신규 가입은 USER·ACTIVE, 관리용 신규 가입은 USER·PENDING으로 만들어진다.
app.bootstrap-developer-email=${BOOTSTRAP_DEVELOPER_EMAIL:}

# 알림 메일(기획안 7장)이 담는 조회 링크의 기준 주소. 배포 시 FRONTEND_URL로 실제 주소를 넣는다.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# 메일의 발신 주소. 비워 두면 spring.mail.username(아래)을 그대로 쓴다.
app.mail-from=${MAIL_FROM:}

# SMTP 설정은 일부러 여기 두지 않는다. spring.mail.host를 아예 선언하지 않으면 Spring Boot가
# JavaMailSender 빈 자체를 안 만들어서, 메일 계정이 없는 팀원도 로컬에서 그냥 기동할 수 있다
# (NotificationService가 빈이 없으면 발송 자체를 생략한다). 실제로 발송해 보려면 아래 환경 변수를
# 채워서 띄운다 — 예) Gmail 앱 비밀번호 기준:
#   SPRING_MAIL_HOST=smtp.gmail.com
#   SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=앱 메일 주소
#   SPRING_MAIL_PASSWORD=앱 비밀번호
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
