# PostgreSQL profile for local Docker or deployment environments.
spring.config.activate.on-profile=docker

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/feedback}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:feedback}
spring.datasource.password=${DB_PASSWORD:feedback}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
