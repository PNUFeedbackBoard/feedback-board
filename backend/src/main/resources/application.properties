spring.application.name=feedback

# 기본 프로필은 dev 다. 아무 옵션 없이 띄우면 H2 인메모리 + 데모 로그인으로 뜬다.
# 프로필별 설정은 application-{프로필}.properties 에 있다. dev 는 application-dev.properties 다.
# 운영·도커는 실행할 때 프로필을 지정한다. 예: --spring.profiles.active=docker
spring.profiles.default=dev

server.port=${SERVER_PORT:8080}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# H2 콘솔은 dev 프로필에서만 켠다. 여기서 꺼 두면 프로필을 빠뜨려도 운영에 노출되지 않는다.
spring.h2.console.enabled=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# 데모 로그인(POST /api/dev/login, POST /api/dev/logout)은 DevLoginController 에 @Profile("dev") 가 붙어 있다.
# dev 가 아닌 프로필에서는 빈으로 등록되지 않으므로 경로 자체가 없고 404 가 된다(기획안 13-2).

# 알림 메일(기획안 7장)이 담는 조회 링크의 기준 주소. 배포 시 FRONTEND_URL로 실제 주소를 넣는다.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# 메일의 발신 주소. 비워 두면 spring.mail.username(아래)을 그대로 쓴다.
app.mail-from=${MAIL_FROM:}

# SMTP 설정은 일부러 여기 두지 않는다. spring.mail.host를 아예 선언하지 않으면 Spring Boot가
# JavaMailSender 빈 자체를 안 만들어서, 메일 계정이 없는 팀원도 로컬에서 그냥 기동할 수 있다
# (NotificationService가 빈이 없으면 발송 자체를 생략한다). 실제로 발송해 보려면 아래 환경 변수를
# 채워서 띄운다 — 예) Gmail 앱 비밀번호 기준:
#   SPRING_MAIL_HOST=smtp.gmail.com
#   SPRING_MAIL_PORT=587
#   SPRING_MAIL_USERNAME=앱 메일 주소
#   SPRING_MAIL_PASSWORD=앱 비밀번호
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH=true
#   SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE=true
