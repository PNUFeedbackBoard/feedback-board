# dev 프로필 - 로컬 개발용. 기본 프로필이라 아무 옵션 없이 ./gradlew bootRun 하면 이 설정으로 뜬다.
# 4명이 각자 PC에서 DB 설치 없이 띄울 수 있도록 H2 인메모리를 쓴다.
# 서버를 내리면 데이터는 사라진다. 정상이다. 시드 데이터가 기동할 때마다 다시 들어간다.

spring.datasource.url=jdbc:h2:mem:feedback;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 콘솔: http://localhost:8080/h2-console
# JDBC URL 칸에 jdbc:h2:mem:feedback 을 넣고, 사용자 sa, 비밀번호는 비운다.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# 인메모리라 매번 새로 만드는 편이 안전하다. 엔티티를 고치면 바로 스키마에 반영된다.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 권한(401/403) 문제를 추적할 때만 주석을 푼다. 평소에는 로그가 너무 길어진다.
#logging.level.org.springframework.security=DEBUG
