# PostgreSQL profile for local Docker or deployment environments.
# 운영 배포 시 SPRING_PROFILES_ACTIVE=docker 를 명시하고, DB_* 값은 서버의 비밀 저장소에서 주입한다.
# 전체 운영 체크리스트: docs/school-server-deployment.md
spring.config.activate.on-profile=docker

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/feedback}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:feedback}
spring.datasource.password=${DB_PASSWORD:feedback}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.h2.console.enabled=false
